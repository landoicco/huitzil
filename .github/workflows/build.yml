# Builds a ready-to-play package of the game for Windows, Linux and macOS.
# Every pull request uploads them as workflow artifacts; pushing a version tag
# (v1.2.3) also publishes them on a GitHub Release.
name: Build

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest # Apple Silicon
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jar
        run: |
          mvn -B -q package
          mkdir input && cp target/huitzil.jar input/
          echo "VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"

      # A trimmed Java runtime goes inside the app, so players don't need Java installed
      - name: Package app
        run: |
          case "${{ matrix.platform }}" in
            linux) options=(--icon packaging/huitzil.png) ;;
            windows) options=(--icon packaging/huitzil.ico) ;;
            # GLFW must run on the main thread on macOS
            macos) options=(--icon packaging/huitzil.icns --java-options -XstartOnFirstThread
                            --mac-package-identifier dev.licaza.huitzil) ;;
          esac
          jpackage --type app-image \
            --name Huitzil \
            --app-version "$VERSION" \
            --vendor licaza.dev \
            --input input \
            --main-jar huitzil.jar \
            --add-modules java.desktop,java.prefs,jdk.unsupported \
            --jlink-options "--strip-debug --no-header-files --no-man-pages --strip-native-commands" \
            --dest app \
            "${options[@]}"

      - name: Archive (Linux)
        if: matrix.platform == 'linux'
        run: tar -czf Huitzil-linux.tar.gz -C app Huitzil

      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        run: 7z a -tzip Huitzil-windows.zip ./app/Huitzil

      # Without a paid Apple certificate, an ad-hoc signature is the best we can do:
      # macOS then asks to allow the app once instead of calling it damaged
      - name: Archive (macOS)
        if: matrix.platform == 'macos'
        run: |
          codesign --force --deep --sign - app/Huitzil.app
          jpackage --type dmg --app-image app/Huitzil.app --name Huitzil --app-version "$VERSION" --dest .
          mv Huitzil-*.dmg Huitzil-macos.dmg

      # Uploaded as is, so the download isn't a zip inside a zip
      - uses: actions/upload-artifact@v7
        with:
          path: Huitzil-${{ matrix.platform }}.*
          archive: false
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: Huitzil-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's|^    <version>\(.*\)</version>|\1|p' pom.xml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the pom version $version" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Huitzil $version" --generate-notes
